spring:
  application:
    name: MerchIPK
  datasource:
    url: jdbc:h2:file:/data/demo
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate.ddl-auto: create
  h2:
    console:
      enabled: true
  mvc:
    hiddenmethod:
      filter:
        enabled: true