<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Мерч ИПК</title>
</head>
<body>

<div style="background-color: #f8f9fa; padding: 15px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-radius: 5px; font-family: Arial, sans-serif;">

    <div>
            <span th:if="${session.currentUser != null}">
                Logged in as: <strong th:text="${session.currentUser}"></strong>
            </span>
        <span th:if="${session.currentUser == null}">
                You are browsing as a <strong>Guest</strong>
            </span>
    </div>

    <div>
            <span th:if="${session.currentUser == null}">
                <a href="/signin" style="margin-right: 15px; text-decoration: none; padding: 6px 12px; background-color: #007bff; color: white; border-radius: 4px; display: inline-block;">Sign In</a>
                <a href="/signup" style="text-decoration: none; padding: 6px 12px; background-color: #28a745; color: white; border-radius: 4px; display: inline-block;">Sign Up</a>
            </span>

        <span th:if="${session.currentUser != null}">
                <a href="/my_basket" style="text-decoration: none; padding: 6px 12px; background-color: #17a2b8; color: white; border-radius: 4px; display: inline-block;">Моя корзина</a>
                <a href="/signout" style="text-decoration: none; padding: 6px 12px; background-color: #dc3545; color: white; border-radius: 4px; display: inline-block;">Sign Out</a>
            </span>
    </div>
</div>

<h2>Товары</h2>
    <table border="1" style="border-collapse: collapse; width: 100%; max-width: 600px; text-align: left;">
        <thead>
            <tr style="background-color: #f2f2f2;">
                <th style="padding: 8px;">Товар</th>
                <th th:if="${session.currentUser == 'admin'}" style="padding: 8px;">Edit</th>
                <th th:if="${session.currentUser == 'admin'}" style="padding: 8px;">Delete</th>
            </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}" th:if="${product.isActive or session.currentUser == 'admin'}">

            <td style="padding: 8px;">
                <a th:href="@{/product/{id}(id=${product.id})}"
                   th:text="${product.name}"
                   th:style="${product.isActive} ? 'text-decoration: none; color: #007bff; font-weight: bold;' : 'text-decoration: line-through; color: #6c757d;'">
                </a>
                <span th:if="${!product.isActive}" style="color: red; font-size: 12px; margin-left: 5px;">(Удален)</span>
            </td>

            <td th:if="${session.currentUser == 'admin'}" style="padding: 8px;">
                <a th:href="@{/edit_product/{id}(id=${product.id})}">Edit</a>
            </td>

            <td th:if="${session.currentUser == 'admin'}" style="padding: 8px;">
                <form th:if="${product.isActive}" th:action="@{/delete_product/{id}(id=${product.id})}" th:method="delete" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure?')" style="background:none; border:none; color:red; cursor:pointer; text-decoration:underline; padding:0; font-family: inherit; font-size: inherit;">
                        Delete
                    </button>
                </form>

                <form th:if="${!product.isActive}" th:action="@{/return_product/{id}(id=${product.id})}" th:method="put" style="display:inline;">
                    <button type="submit" onclick="return confirm('Восстановить этот товар?')" style="background:none; border:none; color:#28a745; cursor:pointer; text-decoration:underline; padding:0; font-family: inherit; font-size: inherit;">
                        Return
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${session.currentUser == 'admin'}">
        <a href="/addproduct">Add a new product</a>
    </p>


</body>
</html>
