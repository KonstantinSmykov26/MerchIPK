<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Информация о товаре</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">

<div>
            <span th:if="${session.currentUser != null}">
                Logged in as: <strong th:text="${session.currentUser}"></strong>
            </span>
    <span th:if="${session.currentUser == null}">
                You are browsing as a <strong>Guest</strong>
            </span>
    <a href="/my_basket" style="text-decoration: none; padding: 6px 12px; background-color: #17a2b8; color: white; border-radius: 4px; display: inline-block;">Моя корзина</a>
</div>

<div style="margin-bottom: 20px;">
    <a href="/" style="text-decoration: none; color: #6c757d;">&larr; Назад к списку товаров</a>
</div>

<div style="border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; max-width: 500px; background-color: #f8f9fa;">
    <h1 th:text="${productDto.name}" style="margin-top: 0; color: #333;">Название товара</h1>

    <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 15px 0;">

    <h3>Описание:</h3>
    <p th:text="${productDto.description}" style="color: #495057; line-height: 1.5; font-size: 16px;">
        Здесь будет подробное описание товара.
    </p>
</div>

<div style="margin-top: 20px;">
    <form th:action="@{/addbasket}" method="post" style="display: flex; align-items: center; gap: 10px;">

        <input type="hidden" name="productId" th:value="${productDto.id}">

        <label Invisible for="quantity" style="font-family: Arial, sans-serif; color: #495057;">Количество:</label>
        <input type="number"
               id="quantity"
               name="quantity"
               value="1"
               min="1"
               max="99"
               style="width: 60px; padding: 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; text-align: center;">

        <button type="submit"
                style="padding: 7px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: bold;">
            Добавить в корзину
        </button>
    </form>
</div>

</body>
</html>
